<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>宅シェフ　注文フォーム</title>
    <link rel="shortcut icon" href="../../image/favicon.ico" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Sawarabi+Gothic&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../css/reset.css" />
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body>
    <header class="header">
      <a href="../index.html">
        <figure class="logo_position">
          <img src="../../image/logo.png" alt="ロゴマーク" width="112px" />
        </figure>
      </a>
    </header>
    <main class="main" id="order">
      <div id="input-screen">
        <div class="title_border">
          <p class="title_text">注文フォーム</p>
        </div>
        <div class="bread_lists">
          <div class="bread_box">
            <div class="bread_orange_circle bread_next_orange_line">
              <p class="bread_white_text">1</p>
            </div>
            <div class="bread_text">
              <p class="bread_orange_text">注文フォーム</p>
            </div>
          </div>
          <div class="bread_box">
            <div class="bread_gray_circle bread_next_gray_line">
              <p class="bread_white_text">2</p>
            </div>
            <div class="bread_text">
              <p class="bread_gray_text">確認画面</p>
            </div>
          </div>
          <div class="bread_box">
            <div class="bread_gray_circle bread_next_gray_line"><p class="bread_white_text">3</p></div>
            <div class="bread_text">
              <p class="bread_gray_text">商品選択画面</p>
            </div>
          </div>
          <div class="bread_box">
            <div class="bread_gray_circle"><p class="bread_white_text">4</p></div>
            <div class="bread_text">
              <p class="bread_gray_text">注文完了</p>
            </div>
          </div>
        </div>
        <div class="order_list">
          <form action="" id="order_form">
            <div class="order_heading_text_box">
              <p class="order_heading_text">＜ご注文内容＞</p>
            </div>
            <p class="order_list_text">ご注文商品※</p>
            <!-- ここから -->
            <div class="order_select_box">
              <div id="select"></div>
              <!-- ここまで -->
              <!-- <select name="food_set" id="menu_select" required>
                <option value="">選択してください</option>
                <option id="menu_select_14" value="14">14</option>
                <option id="menu_select_6" value="6">6</option>
              </select> -->
              <p>食セット</p>
            </div>
            <p class="order_list_text">配送頻度※</p>
            <div class="order_select_box">
              <select name="deliver" id="deliver_frequency_select" required>
                <option value="">選択してください</option>
                <option value="1週間">1週間</option>
                <option value="2週間">2週間</option>
                <option value="3週間">3週間</option>
                <option value="4週間">4週間</option>
              </select>
              <p>/1回</p>
            </div>
            <p class="order_list_text">ご注文数※</p>
            <div class="order_quantity_select_box">
              <select name="quantity" id="quantity_select" required>
                <option value="">選択してください</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
              </select>
              <p>個</p>
            </div>
            <div class="order_heading_text_box">
              <p class="order_heading_text">＜ご注文者情報＞</p>
            </div>
            <div class="address_wrapper">
              <dl class="order_box">
                <div>
                  <dt>郵便番号※</dt>
                  <dd class="post_code_box">
                    <input type="text" name="" id="post_code" placeholder="0000000" required />
                  </dd>
                </div>
              </dl>
              <dl class="prefectures_box">
                <p class="order_list_text">都道府県※</p>
                <select name="ken" id="prefectures" required>
                  <option value="">選択してください</option>
                  <option value="北海道">北海道</option>
                  <option value="青森県">青森県</option>
                  <option value="岩手県">岩手県</option>
                  <option value="宮城県">宮城県</option>
                  <option value="秋田県">秋田県</option>
                  <option value="山形県">山形県</option>
                  <option value="福島県">福島県</option>
                  <option value="茨城県">茨城県</option>
                  <option value="栃木県">栃木県</option>
                  <option value="群馬県">群馬県</option>
                  <option value="埼玉県">埼玉県</option>
                  <option value="千葉県">千葉県</option>
                  <option value="東京都">東京都</option>
                  <option value="神奈川県">神奈川県</option>
                  <option value="新潟県">新潟県</option>
                  <option value="富山県">富山県</option>
                  <option value="石川県">石川県</option>
                  <option value="福井県">福井県</option>
                  <option value="山梨県">山梨県</option>
                  <option value="長野県">長野県</option>
                  <option value="岐阜県">岐阜県</option>
                  <option value="静岡県">静岡県</option>
                  <option value="愛知県">愛知県</option>
                  <option value="三重県">三重県</option>
                  <option value="滋賀県">滋賀県</option>
                  <option value="京都府">京都府</option>
                  <option value="大阪府">大阪府</option>
                  <option value="兵庫県">兵庫県</option>
                  <option value="奈良県">奈良県</option>
                  <option value="和歌山県">和歌山県</option>
                  <option value="鳥取県">鳥取県</option>
                  <option value="島根県">島根県</option>
                  <option value="岡山県">岡山県</option>
                  <option value="広島県">広島県</option>
                  <option value="山口県">山口県</option>
                  <option value="徳島県">徳島県</option>
                  <option value="香川県">香川県</option>
                  <option value="愛媛県">愛媛県</option>
                  <option value="高知県">高知県</option>
                  <option value="福岡県">福岡県</option>
                  <option value="佐賀県">佐賀県</option>
                  <option value="長崎県">長崎県</option>
                  <option value="熊本県">熊本県</option>
                  <option value="大分県">大分県</option>
                  <option value="宮崎県">宮崎県</option>
                  <option value="鹿児島県">鹿児島県</option>
                  <option value="沖縄県">沖縄県</option>
                </select>
              </dl>
            </div>
            <dl>
              <div class="order_box">
                <dt>住所※</dt>
                <dd><input type="text" name="" placeholder="市区町村以降" id="address" required /></dd>
              </div>
              <div class="name_box">
                <div>
                  <dt>姓※</dt>
                  <dd><input type="text" name="user-name" placeholder="山田" id="last_name" required /></dd>
                </div>
                <div>
                  <dt>名※</dt>
                  <dd>
                    <input type="text" name="user-name" placeholder="太郎" id="first_name" required />
                  </dd>
                </div>
              </div>
              <div class="name_box">
                <div>
                  <dt>せい※</dt>
                  <dd><input type="text" name="user-name" placeholder="やまだ" id="furigana_last_name" required /></dd>
                </div>
                <div>
                  <dt>めい※</dt>
                  <dd>
                    <input type="text" name="user-name" placeholder="たろう" id="furigana_first_name" required />
                  </dd>
                </div>
              </div>
              <div class="mail_box">
                <dt>メール※</dt>
                <dd><input type="email" name="email" id="mail" placeholder="sample@example.jp" required /></dd>
              </div>
              <div class="tell_box">
                <dt>電話番号</dt>
                <dd><input type="tel" name="" id="tel" placeholder="000-0000-0000" /></dd>
              </div>
            </dl>
            <div class="confirm_btn_box">
              <button type="button" id="confirm_btn">確認画面</button>
            </div>
          </form>
        </div>
      </div>
      <div id="confirm-screen" class="confirm-screen_position hidden">
        <div class="title_border">
          <p class="title_text">確認画面</p>
        </div>
        <div class="bread_lists">
          <div class="bread_box">
            <div class="bread_gray_circle bread_next_gray_line">
              <p class="bread_white_text">1</p>
            </div>
            <div class="bread_text">
              <p class="bread_gray_text">注文フォーム</p>
            </div>
          </div>
          <div class="bread_box">
            <div class="bread_orange_circle bread_next_orange_line">
              <p class="bread_white_text">2</p>
            </div>
            <div class="bread_text">
              <p class="bread_orange_text">確認画面</p>
            </div>
          </div>
          <div class="bread_box">
            <div class="bread_gray_circle bread_next_gray_line"><p class="bread_white_text">3</p></div>
            <div class="bread_text">
              <p class="bread_gray_text">商品選択画面</p>
            </div>
          </div>
          <div class="bread_box">
            <div class="bread_gray_circle"><p class="bread_white_text">4</p></div>
            <div class="bread_text">
              <p class="bread_gray_text">注文完了</p>
            </div>
          </div>
        </div>
        <div class="confirm_list">
          <div class="confirm_box">
            <label class="confirm_text">ご注文商品 </label>
            <div class="confirm_date_box">
              <span id="confirm_menu_select"></span>
            </div>
          </div>
          <div class="confirm_box">
            <label class="confirm_text">配送頻度 </label>
            <div class="confirm_date_box">
              <span id="confirm_deliver_frequency_select"></span>
            </div>
          </div>
          <div class="confirm_box">
            <label class="confirm_text">数量</label>
            <div class="confirm_date_box">
              <span id="confirm_quantity_select"></span>
            </div>
          </div>
          <div class="confirm_box">
            <label class="confirm_text">郵便番号</label>
            <div class="confirm_date_box">
              <span id="confirm_post_code"></span>
            </div>
          </div>
          <div class="confirm_box">
            <label class="confirm_text">都道府県</label>
            <div class="confirm_date_box">
              <span id="confirm_prefectures"></span>
            </div>
          </div>
          <div class="confirm_box">
            <label class="confirm_text">住所</label>
            <div class="confirm_date_box">
              <span id="confirm_address"></span>
            </div>
          </div>
          <div class="confirm_box">
            <label class="confirm_text">姓名</label>
            <div class="confirm_date_box">
              <span id="confirm_last_name"></span>
              <span id="confirm_first_name"></span>
            </div>
          </div>
          <div class="confirm_box">
            <label class="confirm_text">せいめい</label>
            <div class="confirm_date_box">
              <span id="confirm_furigana_last_name"></span>
              <span id="confirm_furigana_first_name"></span>
            </div>
          </div>
          <div class="confirm_box">
            <label class="confirm_text">メール</label>
            <div class="confirm_date_box">
              <span id="confirm_mail"></span>
            </div>
          </div>
          <div class="confirm_box">
            <label class="confirm_text">電話番号</label>
            <div class="confirm_date_box">
              <span id="confirm_tel"></span>
            </div>
          </div>
        </div>
        <div class="confirm_btn_groop_box">
          <div class="back_btn_position">
            <button type="button" id="back_btn">入力内容修正</button>
          </div>
          <div class="order_btn_position">
            <button type="button" id="order_btn">注文を確定する</button>
          </div>
        </div>
      </div>
      <!-- hide -->
      <div id="select-screen" class="select-screen_position">
        <div class="title_border">
          <p class="title_text">商品選択</p>
        </div>
        <div class="bread_lists">
          <div class="bread_box">
            <div class="bread_gray_circle bread_next_gray_line">
              <p class="bread_white_text">1</p>
            </div>
            <div class="bread_text">
              <p class="bread_gray_text">注文フォーム</p>
            </div>
          </div>
          <div class="bread_box">
            <div class="bread_gray_circle bread_next_gray_line">
              <p class="bread_white_text">2</p>
            </div>
            <div class="bread_text">
              <p class="bread_gray_text">確認画面</p>
            </div>
          </div>
          <div class="bread_box">
            <div class="bread_orange_circle bread_next_orange_line"><p class="bread_white_text">3</p></div>
            <div class="bread_text">
              <p class="bread_orange_text">商品選択画面</p>
            </div>
          </div>
          <div class="bread_box">
            <div class="bread_gray_circle"><p class="bread_white_text">4</p></div>
            <div class="bread_text">
              <p class="bread_gray_text">注文完了</p>
            </div>
          </div>
        </div>
        <div class="lunchbox_container">
          <div class="lunchbox_wrapper">
            <img src="../../image/noriben.jpg" alt="のり弁当" width="300px" />
            <figcaption>
              <p class="lunchbox_text">のり弁当</p>
            </figcaption>
            <div class="lunchbox_count_box">
              <button type="button" id="nori_lunchbox_plus" class="count_btn_plus">+</button>
              <span id="nori_luntchbox_count">0</span>
              <button type="button" id="nori_lunchbox_minus" class="count_btn_minus">-</button>
            </div>
          </div>
        </div>
        <div class="lunchbox_container">
          <div class="lunchbox_wrapper">
            <img src="../../image/hamben.jpg" alt="ハンバーグ弁当" width="300px" />
            <figcaption>
              <p class="lunchbox_text">ハンバーグ弁当</p>
            </figcaption>
            <div class="lunchbox_count_box">
              <button type="button" id="humburg_lunchbox_plus" class="count_btn_plus">+</button>
              <span id="humburg_luntchbox_count">0</span>
              <button type="button" id="humburg_lunchbox_minus" class="count_btn_minus">-</button>
            </div>
          </div>
        </div>
        <div class="lunchbox_container">
          <div class="lunchbox_wrapper">
            <img src="../../image/chicken_thigh_bento.jpg" alt="鶏ももの炭火焼き弁当" width="300px" />
            <figcaption>
              <p class="lunchbox_text">鶏ももの炭火焼き弁当</p>
            </figcaption>
            <div class="lunchbox_count_box">
              <button type="button" id="chicken_thigh_lunchbox_plus" class="count_btn_plus">+</button>
              <span id="chicken_thigh_luntchbox_count">0</span>
              <button type="button" id="chicken_thigh_lunchbox_minus" class="count_btn_minus">-</button>
            </div>
          </div>
        </div>
        <div class="lunchbox_container">
          <div class="lunchbox_wrapper">
            <img src="../../image/salmon_bento.jpg" alt="銀鮭弁当" width="300px" />
            <figcaption>
              <p class="lunchbox_text">銀鮭弁当</p>
            </figcaption>
            <div class="lunchbox_count_box">
              <button type="button" id="salmon_lunchbox_plus" class="count_btn_plus">+</button>
              <span id="salmon_luntchbox_count">0</span>
              <button type="button" id="salmon_lunchbox_minus" class="count_btn_minus">-</button>
            </div>
          </div>
        </div>
        <div class="lunchbox_container">
          <div class="lunchbox_wrapper">
            <img src="../../image/curry_bento.jpg" alt="野菜豊富なカレー弁当" width="300px" />
            <figcaption>
              <p class="lunchbox_text">野菜豊富なカレー弁当</p>
            </figcaption>
            <div class="lunchbox_count_box">
              <button type="button" id="curry_lunchbox_plus" class="count_btn_plus">+</button>
              <span id="curry_luntchbox_count">0</span>
              <button type="button" id="curry_lunchbox_minus" class="count_btn_minus">-</button>
            </div>
          </div>
        </div>
        <div class="">
          <p>
            あと
            <span id="cart_count">0</span>
            食お選びください
          </p>
        </div>
      </div>
    </main>
    <footer class="footer">
      <div class="footer_border">
        <div class="copyright_text_position">
          <p class="Copyright_text">©taku_chef</p>
        </div>
      </div>
    </footer>
    <script src="../../js/script.js"></script>
  </body>
</html>

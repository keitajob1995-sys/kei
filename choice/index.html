<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>宅シェフ　メニュー選択画面</title>
    <link rel="shortcut icon" href="../../image/favicon.ico" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Sawarabi+Gothic&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../css/reset.css" />
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body>
    <main class="main" id="choice">
      <div class="lunchbox_container">
        <div class="lunchbox_wrapper">
          <img src="../../image/noriben.jpg" alt="海苔弁当" width="300px" />
          <figcaption>
            <p>のり弁当</p>
          </figcaption>
          <div class="">
            <button type="button" id="nori_lunchbox_plus">+</button>
            <span id="nori_luntchbox_count">0</span>
            <button type="button" id="nori_lunchbox_minus">-</button>
          </div>
        </div>
      </div>
      <div class="lunchbox_container">
        <div class="lunchbox_wrapper">
          <img src="../../image/hamben.jpg" alt="ハンバーグ弁当" width="300px" />
          <figcaption>
            <p>ハンバーグ弁当</p>
          </figcaption>
          <div class="">
            <button type="button" id="humburg_lunchbox_plus">+</button>
            <span id="humburg_luntchbox_count">0</span>
            <button type="button" id="humburg_lunchbox_minus">-</button>
          </div>
        </div>
      </div>
      <div class="">
        <p>
          あと
          <span id="cart_count">0</span>
          食お選びください
        </p>
      </div>
    </main>
    <script src="../../js/script.js"></script>
  </body>
</html>
